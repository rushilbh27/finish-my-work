<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" style="background:#ffffff; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, monospace;">
  <defs>
    <!-- Graph paper pattern -->
    <pattern id="lightGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 16 0 L 0 0 0 16" fill="none" stroke="#f1f5f9" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Grid -->
  <rect width="860" height="260" fill="#ffffff"/>
  <rect width="860" height="260" fill="url(#lightGrid)"/>

  <!-- Outer Neo-brutalist Frame -->
  <rect x="14" y="14" width="832" height="232" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <rect x="18" y="18" width="832" height="232" fill="none" stroke="#0f172a" stroke-width="0" />

  <!-- Left: Simulated Neo-Brutalist Mode Selector & Menu -->
  <g transform="translate(36, 36)">
    <!-- Closed Mode Box -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="340" height="34" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
      <!-- Shadow -->
      <rect x="2" y="2" width="340" height="34" fill="none" stroke="#0f172a" stroke-width="1.8"/>
      <rect x="0" y="0" width="340" height="34" fill="#ffffff" stroke="#0f172a" stroke-width="1.8"/>
      
      <text x="14" y="21" fill="#64748b" font-size="10" font-weight="700" letter-spacing="1">MODE</text>
      
      <!-- Inner dropdown display box -->
      <rect x="58" y="5" width="272" height="24" fill="#f8fafc" stroke="#0f172a" stroke-width="1.2"/>
      <text x="70" y="21" fill="#0f172a" font-size="11" font-weight="700">Draft Only</text>
      <!-- Chevron -->
      <path d="M 314 15 L 319 20 L 324 15" fill="none" stroke="#0f172a" stroke-width="1.8" stroke-linecap="round"/>
    </g>

    <!-- Expanded Menu (Simulated OS/Chrome menu) -->
    <g transform="translate(58, 44)">
      <!-- Menu Frame with frosted shadow -->
      <rect x="0" y="0" width="330" height="136" rx="8" fill="#1e293b" opacity="0.96"/>
      <rect x="0" y="0" width="330" height="136" rx="8" fill="none" stroke="#334155" stroke-width="1"/>

      <!-- Option 1 (Selected) -->
      <rect x="6" y="6" width="318" height="28" rx="5" fill="#2563eb"/>
      <text x="16" y="24" fill="#ffffff" font-size="12" font-weight="700">✓</text>
      <text x="32" y="24" fill="#ffffff" font-size="11" font-weight="600">Draft Only: Solve, don't submit</text>

      <!-- Option 2 -->
      <g transform="translate(6, 38)">
        <text x="32" y="20" fill="#e2e8f0" font-size="11" font-weight="500">Full Submit: Solve + submit quiz</text>
      </g>

      <!-- Option 3 -->
      <g transform="translate(6, 70)">
        <text x="32" y="20" fill="#e2e8f0" font-size="11" font-weight="500">Course Batch: All assignments in course</text>
      </g>

      <!-- Option 4 -->
      <g transform="translate(6, 102)">
        <text x="32" y="20" fill="#e2e8f0" font-size="11" font-weight="500">All Courses: Every assignment everywhere</text>
      </g>
    </g>
  </g>

  <!-- Right: Clean Technical Explanations -->
  <g transform="translate(470, 36)">
    <!-- Header -->
    <text x="0" y="16" fill="#0f172a" font-size="13" font-weight="800" letter-spacing="0.5">// 4 AUTONOMOUS AGENT POLICIES</text>
    
    <!-- Item 1 -->
    <g transform="translate(0, 34)">
      <circle cx="6" cy="6" r="3" fill="#2563eb"/>
      <text x="18" y="10" fill="#0f172a" font-size="11" font-weight="700">01. Draft Only</text>
      <text x="18" y="24" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Solves every question and paginates. Halts safely before final submit.</text>
    </g>

    <!-- Item 2 -->
    <g transform="translate(0, 78)">
      <circle cx="6" cy="6" r="3" fill="#10b981"/>
      <text x="18" y="10" fill="#0f172a" font-size="11" font-weight="700">02. Full Submit</text>
      <text x="18" y="24" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Answers quiz, triggers submit button, confirms modals, and validates completion.</text>
    </g>

    <!-- Item 3 -->
    <g transform="translate(0, 122)">
      <circle cx="6" cy="6" r="3" fill="#f59e0b"/>
      <text x="18" y="10" fill="#0f172a" font-size="11" font-weight="700">03. Course Batch</text>
      <text x="18" y="24" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Iterates through all pending assignments and quizzes across current course.</text>
    </g>

    <!-- Item 4 -->
    <g transform="translate(0, 166)">
      <circle cx="6" cy="6" r="3" fill="#8b5cf6"/>
      <text x="18" y="10" fill="#0f172a" font-size="11" font-weight="700">04. All Courses</text>
      <text x="18" y="24" fill="#64748b" font-size="10" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Universal sweep crawling all enrolled courses across the student dashboard.</text>
    </g>
  </g>
</svg>
