<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" style="background:#ffffff; font-family:'JetBrains Mono', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
  <defs>
    <!-- Graph Grid Pattern -->
    <pattern id="neoGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e2e8f0" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="#ffffff"/>
  <rect width="1200" height="480" fill="url(#neoGrid)"/>

  <!-- Outer Neo-Brutalist Frame -->
  <!-- Shadow -->
  <rect x="28" y="28" width="1144" height="424" fill="#0f172a"/>
  <!-- Card Base -->
  <rect x="24" y="24" width="1144" height="424" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>

  <!-- Top System Bar -->
  <g transform="translate(56, 52)">
    <rect x="0" y="0" width="220" height="28" fill="#f8fafc" stroke="#0f172a" stroke-width="1.5"/>
    <circle cx="14" cy="14" r="4" fill="#16a34a"/>
    <text x="28" y="18" fill="#0f172a" font-size="10.5" font-weight="800" letter-spacing="1">FREE CHROME EXTENSION</text>
  </g>

  <!-- Top Right BANNER CTA TO STAR THE REPO -->
  <g transform="translate(930, 48)">
    <!-- Shadow -->
    <rect x="3" y="3" width="185" height="34" fill="#0f172a"/>
    <!-- Yellow High-Contrast Star Button -->
    <rect x="0" y="0" width="185" height="34" fill="#facc15" stroke="#0f172a" stroke-width="2"/>
    <text x="92.5" y="22" fill="#0f172a" font-size="12" font-weight="900" text-anchor="middle" letter-spacing="0.5">⭐ STAR ON GITHUB</text>
  </g>

  <!-- Main Hero Brand (Student-Friendly, Zero Jargon) -->
  <g transform="translate(56, 116)">
    <!-- Blue Accent Block -->
    <rect x="0" y="0" width="48" height="6" fill="#2563eb"/>
    <text x="0" y="52" fill="#0f172a" font-size="52" font-weight="900" letter-spacing="-1.5">FINISH MY WORK</text>
    <text x="0" y="86" fill="#2563eb" font-size="16" font-weight="800" letter-spacing="0.5">AUTO-SOLVE YOUR LMS HOMEWORK &amp; QUIZZES IN SECONDS</text>
  </g>

  <!-- Supported Engines Badges (Clean, Simple, Student-Friendly) -->
  <g transform="translate(56, 230)">
    <!-- Free AI -->
    <g transform="translate(0, 0)">
      <rect x="2" y="2" width="140" height="32" fill="#0f172a"/>
      <rect x="0" y="0" width="140" height="32" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="70" y="20" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">✦ Free AI (Built-in)</text>
    </g>

    <!-- Groq -->
    <g transform="translate(155, 0)">
      <rect x="2" y="2" width="150" height="32" fill="#0f172a"/>
      <rect x="0" y="0" width="150" height="32" fill="#fffbeb" stroke="#0f172a" stroke-width="1.5"/>
      <text x="75" y="20" fill="#b45309" font-size="11" font-weight="800" text-anchor="middle">⚡ Groq (Super Fast)</text>
    </g>

    <!-- Gemini -->
    <g transform="translate(320, 0)">
      <rect x="2" y="2" width="175" height="32" fill="#0f172a"/>
      <rect x="0" y="0" width="175" height="32" fill="#eff6ff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="87.5" y="20" fill="#1d4ed8" font-size="11" font-weight="800" text-anchor="middle">🔑 Gemini (Solves Diagrams)</text>
    </g>

    <!-- Any AI -->
    <g transform="translate(510, 0)">
      <rect x="2" y="2" width="130" height="32" fill="#0f172a"/>
      <rect x="0" y="0" width="130" height="32" fill="#faf5ff" stroke="#0f172a" stroke-width="1.5"/>
      <text x="65" y="20" fill="#6b21a8" font-size="11" font-weight="800" text-anchor="middle">🌐 Any Model</text>
    </g>

    <!-- Supported Portals -->
    <g transform="translate(655, 0)">
      <rect x="0" y="0" width="430" height="32" fill="#f8fafc" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="215" y="20" fill="#64748b" font-size="10.5" font-weight="700" text-anchor="middle">MOODLE · CANVAS · PES LMS · BLACKBOARD · H5P</text>
    </g>
  </g>

  <!-- 4 Clean Modes Ribbon (Student Clear) -->
  <g transform="translate(56, 286)">
    <!-- Mode 1 -->
    <g transform="translate(0, 0)">
      <rect x="2" y="2" width="256" height="74" fill="#0f172a"/>
      <rect x="0" y="0" width="256" height="74" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="12" y="10" width="24" height="20" fill="#0f172a"/>
      <text x="24" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">01</text>
      <text x="44" y="25" fill="#0f172a" font-size="13" font-weight="800">Draft Only</text>
      <text x="14" y="52" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Answers quiz · You review &amp; submit</text>
    </g>

    <!-- Mode 2 -->
    <g transform="translate(274, 0)">
      <rect x="2" y="2" width="256" height="74" fill="#0f172a"/>
      <rect x="0" y="0" width="256" height="74" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="12" y="10" width="24" height="20" fill="#2563eb"/>
      <text x="24" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">02</text>
      <text x="44" y="25" fill="#1d4ed8" font-size="13" font-weight="800">Full Submit</text>
      <text x="14" y="52" fill="#3b82f6" font-size="10.5" font-weight="600" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Answers all + auto-submits quiz</text>
    </g>

    <!-- Mode 3 -->
    <g transform="translate(548, 0)">
      <rect x="2" y="2" width="256" height="74" fill="#0f172a"/>
      <rect x="0" y="0" width="256" height="74" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="12" y="10" width="24" height="20" fill="#0f172a"/>
      <text x="24" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">03</text>
      <text x="44" y="25" fill="#0f172a" font-size="13" font-weight="800">Course Batch</text>
      <text x="14" y="52" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Solves every task in this course</text>
    </g>

    <!-- Mode 4 -->
    <g transform="translate(822, 0)">
      <rect x="2" y="2" width="256" height="74" fill="#0f172a"/>
      <rect x="0" y="0" width="256" height="74" fill="#ffffff" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="12" y="10" width="24" height="20" fill="#0f172a"/>
      <text x="24" y="24" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">04</text>
      <text x="44" y="25" fill="#0f172a" font-size="13" font-weight="800">All Courses</text>
      <text x="14" y="52" fill="#64748b" font-size="10.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif">Clears all your enrolled courses</text>
    </g>
  </g>

  <!-- Bottom Shortcuts Footer -->
  <g transform="translate(56, 386)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#0f172a" stroke-width="1" stroke-dasharray="3 3"/>
    
    <!-- Left Shortcuts -->
    <g transform="translate(0, 16)">
      <rect x="0" y="0" width="46" height="22" fill="#0f172a"/>
      <text x="23" y="15" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">⌘⇧S</text>
      <text x="56" y="15" fill="#0f172a" font-size="11" font-weight="700">Solve Current</text>

      <rect x="160" y="0" width="46" height="22" fill="#0f172a"/>
      <text x="183" y="15" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">⌘⇧A</text>
      <text x="216" y="15" fill="#0f172a" font-size="11" font-weight="700">Auto-Pilot</text>

      <rect x="310" y="0" width="46" height="22" fill="#0f172a"/>
      <text x="333" y="15" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">⌘⇧H</text>
      <text x="366" y="15" fill="#0f172a" font-size="11" font-weight="700">Stealth Mode</text>
    </g>

    <!-- Right Privacy Notice -->
    <g transform="translate(830, 16)">
      <circle cx="10" cy="11" r="4" fill="#16a34a"/>
      <text x="22" y="15" fill="#16a34a" font-size="11" font-weight="800">🔒 100% Private · Safe &amp; Undetected</text>
    </g>
  </g>
</svg>
