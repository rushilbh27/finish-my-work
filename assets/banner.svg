<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" style="background:#090d16; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;">
  <defs>
    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.6"/>
    </pattern>

    <!-- Radial Glows -->
    <radialGradient id="blueGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="amberGlow" cx="85%" cy="20%" r="40%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#090d16" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Accents -->
    <linearGradient id="blueLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="50%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Card Shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="460" fill="#090d16"/>
  <rect width="1200" height="460" fill="url(#grid)"/>
  <rect width="1200" height="460" fill="url(#blueGlow)"/>
  <rect width="1200" height="460" fill="url(#amberGlow)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="412" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Badge / Header Tag -->
  <g transform="translate(60, 58)">
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="13" r="4" fill="#10b981"/>
    <text x="26" y="17" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">CHROME EXTENSION // MANIFEST V3</text>
  </g>

  <!-- Top Right Version Pill -->
  <g transform="translate(1030, 58)">
    <rect x="0" y="0" width="110" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="55" y="17" fill="#38bdf8" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">v2.4.0 · MIT</text>
  </g>

  <!-- Main Hero Brand Typography -->
  <g transform="translate(60, 140)">
    <!-- Electric Accent Bar -->
    <rect x="0" y="-36" width="48" height="6" rx="3" fill="url(#blueLine)"/>
    <text x="0" y="8" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-1">FINISH MY WORK</text>
    <text x="0" y="38" fill="#94a3b8" font-size="16" font-weight="500">Universal Autonomous Assignment, Quiz &amp; LMS Coursework Autopilot</text>
  </g>

  <!-- Engine Badges Row -->
  <g transform="translate(60, 206)">
    <!-- Free AI -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">✦ Built-in Free AI</text>
    </g>
    <!-- Groq -->
    <g transform="translate(142, 0)">
      <rect x="0" y="0" width="138" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="69" y="18" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">⚡ Groq Llama 3.3</text>
    </g>
    <!-- Gemini -->
    <g transform="translate(292, 0)">
      <rect x="0" y="0" width="144" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="72" y="18" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">🔑 Gemini Vision AI</text>
    </g>
    <!-- OpenRouter -->
    <g transform="translate(448, 0)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="65" y="18" fill="#c084fc" font-size="11" font-weight="600" text-anchor="middle">🌐 OpenRouter</text>
    </g>
  </g>

  <!-- 4 Agent Modes Horizontal Ribbon -->
  <g transform="translate(60, 260)">
    <!-- Card 1: Draft Only -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="260" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="12" y="12" width="24" height="20" rx="4" fill="#1e293b"/>
      <text x="24" y="26" fill="#38bdf8" font-size="10" font-weight="800" text-anchor="middle">01</text>
      <text x="44" y="27" fill="#f8fafc" font-size="13" font-weight="700">Draft Only</text>
      <text x="14" y="52" fill="#64748b" font-size="11">Solves all pages · Halts before submit</text>
    </g>

    <!-- Card 2: Full Submit -->
    <g transform="translate(274, 0)">
      <rect x="0" y="0" width="260" height="74" rx="8" fill="#0f172a" stroke="#2563eb" stroke-width="1.2"/>
      <rect x="12" y="12" width="24" height="20" rx="4" fill="#2563eb"/>
      <text x="24" y="26" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">02</text>
      <text x="44" y="27" fill="#f8fafc" font-size="13" font-weight="700">Full Submit</text>
      <text x="14" y="52" fill="#93c5fd" font-size="11">Solves + confirms final submission</text>
    </g>

    <!-- Card 3: Course Batch -->
    <g transform="translate(548, 0)">
      <rect x="0" y="0" width="260" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="12" y="12" width="24" height="20" rx="4" fill="#1e293b"/>
      <text x="24" y="26" fill="#fbbf24" font-size="10" font-weight="800" text-anchor="middle">03</text>
      <text x="44" y="27" fill="#f8fafc" font-size="13" font-weight="700">Course Batch</text>
      <text x="14" y="52" fill="#64748b" font-size="11">Iterates all assignments in a course</text>
    </g>

    <!-- Card 4: All Courses -->
    <g transform="translate(822, 0)">
      <rect x="0" y="0" width="260" height="74" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.2"/>
      <rect x="12" y="12" width="24" height="20" rx="4" fill="#1e293b"/>
      <text x="24" y="26" fill="#a855f7" font-size="10" font-weight="800" text-anchor="middle">04</text>
      <text x="44" y="27" fill="#f8fafc" font-size="13" font-weight="700">All Courses</text>
      <text x="14" y="52" fill="#64748b" font-size="11">Universal sweep across all courses</text>
    </g>
  </g>

  <!-- Bottom Metadata & Shortcuts Footer -->
  <g transform="translate(60, 380)">
    <line x1="0" y1="0" x2="1080" y2="0" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4"/>
    
    <!-- Shortcuts -->
    <g transform="translate(0, 18)">
      <rect x="0" y="0" width="46" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="23" y="14" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">⌘⇧S</text>
      <text x="54" y="14" fill="#64748b" font-size="11">Solve</text>

      <rect x="100" y="0" width="46" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="123" y="14" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">⌘⇧A</text>
      <text x="154" y="14" fill="#64748b" font-size="11">Auto-Pilot</text>

      <rect x="230" y="0" width="46" height="20" rx="4" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="253" y="14" fill="#cbd5e1" font-size="10" font-weight="700" text-anchor="middle">⌘⇧H</text>
      <text x="284" y="14" fill="#64748b" font-size="11">Stealth</text>
    </g>

    <!-- Right Privacy Notice -->
    <g transform="translate(860, 18)">
      <circle cx="8" cy="10" r="3.5" fill="#10b981"/>
      <text x="18" y="14" fill="#94a3b8" font-size="11" font-weight="500">100% Client-Side Privacy · No Tracking</text>
    </g>
  </g>
</svg>
